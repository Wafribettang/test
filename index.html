<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saran & Kritik</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: #ffde03;
            border: 4px solid #000;
            padding: 25px;
            box-shadow: 10px 10px 0px 0px #000;
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
        }

        h2 {
            margin: 0 0 20px 0;
            text-transform: uppercase;
            font-size: 1.8rem;
            border-bottom: 4px solid #000;
            display: inline-block;
        }

        textarea {
            width: 100%;
            height: 100px;
            border: 4px solid #000;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            box-sizing: border-box;
            background-color: #fff;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            background-color: #ff5e5e;
            color: #fff;
            border: 4px solid #000;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px 0px #000;
            text-transform: uppercase;
        }

        button:active {
            box-shadow: 0px 0px 0px 0px #000;
            transform: translate(5px, 5px);
        }

        /* Gaya List Saran */
        #list-saran {
            width: 100%;
            max-width: 450px;
        }

        .saran-item {
            background-color: #fff;
            border: 3px solid #000;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 6px 6px 0px 0px #32CD32; /* Warna Hijau */
        }

        .saran-text {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            word-wrap: break-word;
        }

        .timestamp {
            font-size: 0.7rem;
            margin-top: 10px;
            display: block;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>KIRIM SARAN</h2>
    <textarea id="isi_saran" placeholder="Tulis kritik/saran..."></textarea>
    <button onclick="kirimSaran()">KIRIM!</button>
    <div id="status" style="margin-top:10px; font-size: 0.8rem;"></div>
</div>

<div id="list-saran">
    <h2 style="background-color: #32CD32; padding: 5px 15px; color: white;">SARAN MASUK</h2>
    <div id="saran-container">Memuat data...</div>
</div>

<script>
    const SUPABASE_URL = 'https://dnwiofdtselnpjkpaqie.supabase.co';
    const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRud2lvZmR0c2VsbnBqa3BhcWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MDcyODcsImV4cCI6MjA5MzE4MzI4N30.rsN_bpiPgjzXsTUbyZ-q2pIIWxYEyilDeDednOYmYas';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Fungsi Ambil Data
    async function ambilSaran() {
        const container = document.getElementById('saran-container');
        
        const { data, error } = await _supabase
            .from('saran_user')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = "Gagal memuat data.";
            return;
        }

        if (data.length === 0) {
            container.innerHTML = "Belum ada saran.";
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="saran-item">
                <div class="saran-text">${item.isi_saran}</div>
                <span class="timestamp">${new Date(item.created_at).toLocaleString('id-ID')}</span>
            </div>
        `).join('');
    }

    // Fungsi Kirim Data
    async function kirimSaran() {
        const input = document.getElementById('isi_saran');
        const status = document.getElementById('status');

        if (!input.value) return;

        status.innerText = "MENGIRIM...";

        const { error } = await _supabase
            .from('saran_user')
            .insert([{ isi_saran: input.value }]);

        if (error) {
            status.innerText = "GAGAL! CEK RLS POLICY.";
        } else {
            status.innerText = "BERHASIL!";
            input.value = '';
            ambilSaran(); // Refresh list otomatis
        }
    }

    // Load data saat web dibuka
    ambilSaran();
</script>

</body>
</html>
