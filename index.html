<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saran User</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffde03; /* Warna Kuning Terang */
            border: 4px solid #000;
            padding: 30px;
            box-shadow: 10px 10px 0px 0px #000;
            width: 90%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: -1px;
            font-size: 2rem;
            border-bottom: 4px solid #000;
            display: inline-block;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border: 4px solid #000;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
            resize: none;
        }

        textarea:focus {
            outline: none;
            background-color: #e0fbfc;
        }

        button {
            margin-top: 20px;
            width: 100%;
            background-color: #ff5e5e; /* Warna Merah */
            color: #fff;
            border: 4px solid #000;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 5px 5px 0px 0px #000;
            text-transform: uppercase;
        }

        button:active {
            box-shadow: 0px 0px 0px 0px #000;
            transform: translate(5px, 5px);
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>KIRIM SARAN</h2>
    <textarea id="isi_saran" placeholder="Tuliskan saran Anda di sini..."></textarea>
    <button onclick="kirimSaran()">KIRIM SEKARANG!</button>
    <div id="status"></div>
</div>

<script>
    // MASUKKAN DATA ANDA DI SINI
    const SUPABASE_URL = 'https://dnwiofdtselnpjkpaqie.supabase.co';
    const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRud2lvZmR0c2VsbnBqa3BhcWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MDcyODcsImV4cCI6MjA5MzE4MzI4N30.rsN_bpiPgjzXsTUbyZ-q2pIIWxYEyilDeDednOYmYas';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function kirimSaran() {
        const teks = document.getElementById('isi_saran').value;
        const status = document.getElementById('status');

        if (!teks) {
            status.innerText = "ISI DULU KONTENNYA!";
            return;
        }

        status.innerText = "MENGIRIM...";

        const { data, error } = await supabase
            .from('saran_user')
            .insert([{ isi_saran: teks }]);

        if (error) {
            console.error(error);
            status.innerText = "GAGAL TERKIRIM!";
            status.style.color = "red";
        } else {
            status.innerText = "SARAN BERHASIL MASUK!";
            status.style.color = "blue";
            document.getElementById('isi_saran').value = '';
        }
    }
</script>

</body>
</html>
